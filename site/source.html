</style></head><body><div class="layout"><aside class="side"><div class="brand dn-wordmark"><span>DRIVER</span><span>NOTES</span></div><button class="nav active" data-page="home">⌂ &nbsp; Home / Circuits</button><button class="nav" data-page="general">🏎️ &nbsp; Car Info</button><button class="nav" data-page="notes">📝 &nbsp; Notes</button><button class="nav" data-page="settings" onclick="navigate('settings')">⚙️ &nbsp; Settings</button></aside><main class="main"><div id="view"></div></main></div><div id="modalRoot"></div><script>
const KEY='pilot-notes-v1';let state=JSON.parse(localStorage.getItem(KEY)||'{"tracks":[],"cars":[],"general":{}}');let page='home',trackId=null,carId=null,selected=null,placement=null;const $=s=>document.querySelector(s),uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(state))}function getTrack(){return state.tracks.find(t=>t.id===trackId)}function getCar(){return state.cars.find(c=>c.id===carId)}function modal(title,body,buttons=''){ $('#modalRoot').innerHTML=`<div class="modalBg" id="modalBg"><div class="modal"><div class="flex between"><h2>${title}</h2><button class="light" onclick="closeModal()">✕</button></div>${body}${buttons}</div></div>`;$('#modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')closeModal()})}function closeModal(){$('#modalRoot').innerHTML=''}function navigate(p){page=p;placement=null;selected=null;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===((p==='track'?'home':p==='carinfo'?'general':p))));render()}
// Default circuits and cars; merge without overwriting existing notes.
const DEFAULT_CARS=['F2','F3'];
const DEFAULT_TRACKS=[
 ['Jerez de la Frontera','Jerez de la Frontera, Spain'],
 ['Portimão','Portimão, Portugal'],
 ['Barcelona','Montmeló, Spain'],
 ['Paul Ricard','Le Castellet, France'],
 ['Silverstone','Silverstone, United Kingdom'],
 ['Spa-Francorchamps','Stavelot, Belgium'],
 ['Red Bull Ring','Spielberg, Austria'],
 ['Monza','Monza, Italy'],
 ['Imola','Imola, Italy'],
 ['Melbourne','Melbourne, Australia'],
 ['Bahrain','Sakhir, Bahrain'],
 ['Monaco','Monte Carlo, Monaco'],
 ['Madrid','Madrid, Spain'],
 ['Budapest (Hungaroring)','Mogyoród, Hungary'],
 ['Istanbul Park','Istanbul, Türkiye'],
 ['Jeddah','Jeddah, Saudi Arabia'],
 ['Montreal','Montreal, Canada'],
 ['Abu Dhabi','Abu Dhabi, UAE'],
 ['Qatar (Lusail)','Lusail, Qatar']
];
function seedDefaults(){
 state.tracks??=[];
 for(const t of state.tracks){if(t.name==='Jerez de la Frontera — F1 layout')t.name='Jerez de la Frontera';if(t.name==='Paul Ricard — F1 layout')t.name='Paul Ricard'};state.cars??=[];state.general??={};
 if(!state.cars.length){for(const name of DEFAULT_CARS)state.cars.push({id:uid(),name})}
 // Rename only the original default labels, preserving IDs and associated notes.
 for(const car of state.cars){if(car.name==='F2 2018')car.name='F2';else if(car.name==='F3 2026')car.name='F3'}
 // Keep stable car IDs: renaming must never recreate a default car.
 if(!Array.isArray(state.defaultCarIds)){state.defaultCarIds=DEFAULT_CARS.map(name=>state.cars.find(c=>c.name.toLowerCase()===name.toLowerCase())?.id).filter(Boolean)}
 const defaultIds=state.defaultCarIds.filter(id=>state.cars.some(c=>c.id===id));
 for(const [name,location] of DEFAULT_TRACKS){
   let t=state.tracks.find(t=>t.name.toLowerCase()===name.toLowerCase());
   if(!t){t={id:uid(),name,location,carIds:[],entries:{},map:'',mapStatus:'not-searched'};state.tracks.push(t)}
   t.carIds??=[];t.entries??={};t.videos??=[];if(t.map && /^https?:/i.test(t.map)){t.map='';t.mapSource='';t.mapStatus='missing'};for(const e of Object.values(t.entries)){if(e.videos?.length){for(const v of e.videos){if(!t.videos.some(z=>z.id===v.id))t.videos.push(v)}e.videos=[]}}
   for(const id of defaultIds){if(!t.carIds.includes(id))t.carIds.push(id);t.entries[id]??={turns:[],free:[],videos:[]}}
 }
 save();
}
seedDefaults();

let homeSearch='';
function normalizeCountryName(location){
  let x=(location||'').split(',').map(v=>v.trim()).filter(Boolean).pop()||'';
  const map={'uk':'United Kingdom','u.k.':'United Kingdom','great britain':'United Kingdom','england':'United Kingdom','scotland':'United Kingdom','wales':'United Kingdom','usa':'United States','u.s.a.':'United States','united states of america':'United States','uae':'United Arab Emirates','u.a.e.':'United Arab Emirates'};
  const key=x.toLowerCase();
  return map[key]||x;
}
function continentFromCountry(country){
  const c=(country||'').toLowerCase();
  const table={'spain':'Europe','italy':'Europe','belgium':'Europe','united kingdom':'Europe','great britain':'Europe','portugal':'Europe','france':'Europe','austria':'Europe','hungary':'Europe','turkiye':'Europe','turkey':'Europe','monaco':'Europe','qatar':'Asia','bahrain':'Asia','saudi arabia':'Asia','united arab emirates':'Asia','japan':'Asia','australia':'Oceania','canada':'North America','mexico':'North America','united states':'North America'};
  return table[c]||'';
}
function countNotesInTrack(t){
  return Object.values(t.entries||{}).reduce((a,v)=>a+((v.turns||[]).length)+((v.free||[]).length),0);
}
function notesSavedToday(){
  const today=new Date().toDateString();
  let n=0;
  for(const t of state.tracks||[]){
    for(const v of Object.values(t.entries||{})){
      for(const item of [...(v.turns||[]),...(v.free||[])]){
        if(item.createdAt && new Date(item.createdAt).toDateString()===today)n++;
      }
    }
  }
  return n;
}

function render(){if(page==='home')home();if(page==='track')trackPage();if(page==='general')generalPage();if(page==='carinfo')carInfoPage()}
function filterHomeCircuits(query){
  homeSearch=query;
  const grid=document.querySelector('#view .grid');
  if(!grid)return;
  const cards=[...grid.querySelectorAll('.trackCard')];
  let visible=0;
  for(const card of cards){
    const circuit=card.querySelector('h2')?.textContent||'';
    const location=card.querySelector('.muted')?.textContent||'';
    const matched=(circuit+' '+location).toLocaleLowerCase().includes(query.toLocaleLowerCase());
    card.style.display=matched?'':'none';
    if(matched)visible++;
  }
  let empty=document.getElementById('homeSearchEmpty');
  if(!empty){
    empty=document.createElement('div');empty.id='homeSearchEmpty';empty.className='card empty';
    grid.insertAdjacentElement('afterend',empty);
  }
  empty.textContent=cards.length&&!visible?'No circuits match your search.':'';
  empty.style.display=cards.length&&!visible?'':'none';
}
function home(){
  const sorted=[...(state.tracks||[])].sort((a,b)=>a.name.localeCompare(b.name));
  const filtered=sorted;
  const countries=[...new Set(sorted.map(t=>normalizeCountryName(t.location)).filter(Boolean))];
  const continents=[...new Set(countries.map(continentFromCountry).filter(Boolean))];
  const stats=[
    {label:'Circuits', value:sorted.length},
    {label:'Continents', value:continents.length},
    {label:'Countries', value:countries.length},
    {label:'Notes saved today', value:notesSavedToday()}
  ];
  $('#view').innerHTML=`<div class="flex between homeTopBar"><div><h1>My Circuits</h1></div><div class="homeActions"><div class="searchWrap"><input id="homeSearchInput" placeholder="Search circuit" value="${esc(homeSearch)}" oninput="filterHomeCircuits(this.value)"></div><button class="primary" onclick="addTrack()">＋ Add track</button></div></div><div class="statsGrid">${stats.map(s=>`<article class="card statCard"><div class="statValue">${s.value}</div><div class="statLabel">${s.label}</div></article>`).join('')}</div><div class="grid">${filtered.map(t=>`<article class="card trackCard" onclick="openTrack('${t.id}')"><div class="flex between"><h2>${esc(t.name)}</h2><span style="font-size:24px">🏎️</span></div><div class="muted">${esc(t.location||'Circuit')}</div><p class="muted">${(t.carIds||[]).length} cars · ${countNotesInTrack(t)} annotations</p><button class="light">Open circuit →</button></article>`).join('')||`<div class="card empty">${sorted.length?`No circuits match "${esc(homeSearch)}".`:'No circuits yet. Click <b>Add track</b> to start your trackbook.'}</div>`}</div>`
  filterHomeCircuits(homeSearch);
}
function addTrack(){modal('Add a circuit',`<label>Circuit name</label><input id="trackName" placeholder="e.g. Circuit de Barcelona-Catalunya"><label>Location (optional)</label><input id="trackLocation" placeholder="Barcelona, Spain"><div class="tip section">After adding the circuit, click Upload Map Image to select a map from your device.</div><div class="toolbar"><button class="primary" onclick="createTrack()">Create circuit</button></div>`)}
function createTrack(){let name=$('#trackName').value.trim();if(!name)return alert('Enter a circuit name');let t={id:uid(),name,location:$('#trackLocation').value.trim(),carIds:[],entries:{},map:'',mapStatus:'missing'};state.tracks.push(t);save();closeModal();openTrack(t.id)}
function openTrack(id){trackId=id;let t=getTrack();if(!t)return;carId=t.carIds.includes(carId)?carId:t.carIds[0]||null;navigate('track')}
function trackPage(){let t=getTrack();if(!t)return navigate('home');let entry=carId?(t.entries[carId]||{turns:[],free:[],videos:[]}):null;$('#view').innerHTML=`<button class="back" onclick="navigate('home')">← All circuits</button><div class="flex between"><div><h1>${esc(t.name)}</h1><div class="muted">${esc(t.location||'Circuit')} · Track notes by car</div></div><div class="flex"><button class="light" onclick="editTrack()">Edit circuit</button><button class="danger" onclick="deleteTrack()">Delete</button></div></div><div class="toolbar"><b>Car:</b>${t.carIds.map(id=>{let c=state.cars.find(x=>x.id===id);return c?`<button class="chip ${id===carId?'on':''}" onclick="carId='${id}';selected=null;render()">${esc(c.name)}</button>`:''}).join('')}<button class="light" onclick="renameCar(carId)" ${!carId?'disabled':''}>✎ Rename car</button><button class="light" onclick="addCarToTrack()">＋ Add car</button></div>${!carId?'<div class="card empty">Add or select a car to create its corner notes.</div>':`<div class="two"><section class="card"><div class="flex between"><h2>Track map</h2><span class="muted">Click a corner · Double-click for free note</span></div><div class="map" id="map" onclick="choosePlacement(event)" ondblclick="addFreeAt(event)">${t.map?`<img src="${esc(t.map)}" alt="Circuit map" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><div class="placeholder" style="display:none">Map unavailable. Drag & drop a track map or upload an image.</div>`:`<div class="placeholder">${t.mapStatus==='loading'?'⏳ Searching for a track map…':'🗺️ Drag & Drop Track Map<br><small>Drop an image here, or click Upload Map Image below</small>'}</div>`}${placement&&placement.trackId===trackId&&placement.carId===carId&&placement.x!==null?`<button class="pin pending" style="left:${placement.x}%;top:${placement.y}%">${esc(placement.num)}</button>`:""}${(entry.turns||[]).map(n=>`<button class="pin ${selected===n.id?'selected':''}" style="left:${n.x}%;top:${n.y}%" onclick="event.stopPropagation();editNote('${n.id}','turn')" title="Turn ${esc(n.num)}">${esc(n.num)}</button>`).join('')}${(entry.free||[]).map(n=>`<button class="pin free ${selected===n.id?'selected':''}" style="left:${n.x}%;top:${n.y}%" onclick="event.stopPropagation();editNote('${n.id}','free')" title="${esc(n.title)}">!</button>`).join('')}</div><div id="placementControls" class="toolbar" style="display:${placement&&placement.trackId===trackId&&placement.carId===carId?'flex':'none'}">${placement?`<strong>${placement.x===null?'Click on the map to position Turn '+esc(placement.num):'Turn '+esc(placement.num)+' — confirm this position'}</strong><button class="primary" onclick="confirmPlacement()" ${placement.x===null?'disabled':''}>✓ Confirm</button><button class="light" onclick="cancelPlacement()">Cancel</button>`:''}</div><div class="toolbar"><button class="light" onclick="$('#mapFile').click()">↑ Upload map image</button><input class="hide" id="mapFile" type="file" accept="image/*" onchange="uploadMap(this.files[0])"><button class="light" onclick="addTurn()">＋ Add corner number</button>${t.mapSource?`<span class="muted">${esc(t.mapSource)}</span>`:''}</div></div></section><section class="card"><div class="flex between"><h2>${esc(getCar()?.name||'Car')} · Notes</h2><button class="light" onclick="addTurn()">＋ Turn</button></div><div id="notesList">${[...(entry.turns||[]).map(n=>({...n,kind:'turn'})),...(entry.free||[]).map(n=>({...n,kind:'free'}))].map(n=>`<div class="note ${selected===n.id?'selected':''}" onclick="editNote('${n.id}','${n.kind}')"><strong>${n.kind==='turn'?`Turn ${esc(n.num)} · ${esc(n.gear||'Gear —')}`:esc(n.title||'Extra note')}</strong><small>${esc(n.text||'Click to write notes…')}</small></div>`).join('')||'<div class="empty">No notes yet. Add your first corner or double-click on the map.</div>'}</div></section></div>`}`;$('#view').insertAdjacentHTML('beforeend',`<section class="card section"><div class="flex between"><h2>🎥 Onboard Videos</h2><button class="primary" onclick="$('#videoFile').click()">＋ Upload onboard</button><input class="hide" id="videoFile" type="file" accept="video/*" onchange="addVideo(this.files[0])"></div><div class="muted">Shared by all cars for this circuit. Videos are stored locally in this browser.</div><div id="videoList"></div></section>`);renderVideos()}
function editTrack(){let t=getTrack();modal('Edit circuit',`<label>Circuit name</label><input id="editName" value="${esc(t.name)}"><label>Location</label><input id="editLoc" value="${esc(t.location||'')}"><div class="toolbar"><button class="primary" onclick="let t=getTrack();t.name=$('#editName').value.trim()||t.name;t.location=$('#editLoc').value;save();closeModal();render()">Save</button></div>`)}function deleteTrack(){if(confirm('Delete this circuit and all its notes?')){state.tracks=state.tracks.filter(t=>t.id!==trackId);save();navigate('home')}}
function addCarToTrack(){modal('Add a car',`<label>Choose an existing car</label><select id="existingCar"><option value="">— Create new car —</option>${state.cars.filter(c=>!getTrack().carIds.includes(c.id)).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><label>Or new car name</label><input id="newCar" placeholder="e.g. Dallara F3 2025"><div class="toolbar"><button class="primary" onclick="saveCarToTrack()">Add car</button></div>`)}function saveCarToTrack(){let id=$('#existingCar').value,name=$('#newCar').value.trim();if(!id){if(!name)return alert('Enter a car name');let c=state.cars.find(c=>c.name.toLowerCase()===name.toLowerCase());id=c?.id||uid();if(!c)state.cars.push({id,name})}let t=getTrack();if(!t.carIds.includes(id))t.carIds.push(id);t.entries[id]??={turns:[],free:[],videos:[]};carId=id;save();closeModal();render()}
function entry(){let t=getTrack();return t.entries[carId]??(t.entries[carId]={turns:[],free:[],videos:[]})}function addTurn(){if(!carId)return;let count=entry().turns.length+1;modal('Add corner',`<label>Corner number</label><input id="cornerNum" value="${count}" placeholder="e.g. 1"><label>Gear</label><input id="cornerGear" placeholder="e.g. 3rd gear"><label>Driving notes</label><textarea id="cornerText" placeholder="Braking point, entry, apex, throttle, kerbs…"></textarea><div class="toolbar"><button class="primary" onclick="startPlacement()">Place →</button></div>`)}

function editNote(id,kind){selected=id;let n=entry()[kind==='turn'?'turns':'free'].find(x=>x.id===id);if(!n)return;modal(kind==='turn'?'Edit corner':'Edit track annotation',`${kind==='turn'?`<label>Corner number</label><input id="noteNum" value="${esc(n.num)}"><label>Gear</label><input id="noteGear" value="${esc(n.gear||'')}" placeholder="e.g. 3rd gear">`:`<label>Title</label><input id="noteTitle" value="${esc(n.title)}">`}<label>Notes</label><textarea id="noteText">${esc(n.text)}</textarea><div class="toolbar"><button class="primary" onclick="saveNote('${id}','${kind}')">Save changes</button><button class="light" onclick="startPinMove('${id}','${kind}')">↔ Move pin on map</button><button class="danger" onclick="deleteNote('${id}','${kind}')">Delete note</button></div>`)}

let pinMove=null;
function startPinMove(id,kind){let n=entry()[kind==='turn'?'turns':'free'].find(x=>x.id===id);if(!n)return;updateNoteFromEditor(n,kind);save();closeModal();pinMove={id,kind,trackId,carId,oldX:n.x,oldY:n.y};render();showPinMoveControls()}
function showPinMoveControls(){if(!pinMove||pinMove.trackId!==trackId||pinMove.carId!==carId)return;let map=document.getElementById('map');if(!map)return;map.classList.add('pin-move-active');let bar=document.createElement('div');bar.id='pinMoveBar';bar.className='toolbar pin-move-bar';bar.innerHTML='<strong>Click anywhere on the track map to move the pin.</strong><button class="primary" id="confirmPinMove" disabled>✓ Confirm position</button><button class="light" id="cancelPinMove">Cancel</button>';map.insertAdjacentElement('afterend',bar);bar.querySelector('#confirmPinMove').onclick=confirmPinMove;bar.querySelector('#cancelPinMove').onclick=cancelPinMove;map.querySelectorAll('.pin').forEach(p=>p.style.pointerEvents='none');let n=entry()[pinMove.kind==='turn'?'turns':'free'].find(x=>x.id===pinMove.id);if(n){let pins=[...map.querySelectorAll('.pin')];let matching=pins.find(p=>Math.abs(parseFloat(p.style.left)-n.x)<.01&&Math.abs(parseFloat(p.style.top)-n.y)<.01);if(matching){matching.classList.add('moving-pin');pinMove.element=matching}}}
function confirmPinMove(){if(!pinMove||!pinMove.proposed)return;let n=entry()[pinMove.kind==='turn'?'turns':'free'].find(x=>x.id===pinMove.id);if(n){n.x=pinMove.proposed.x;n.y=pinMove.proposed.y;save()}pinMove=null;render()}
function cancelPinMove(){pinMove=null;render()}
document.addEventListener('click',function(e){if(!pinMove)return;let map=e.target.closest?.('#map');if(!map)return;e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();let rect=map.getBoundingClientRect();pinMove.proposed={x:Math.max(2,Math.min(98,(e.clientX-rect.left)/rect.width*100)),y:Math.max(2,Math.min(98,(e.clientY-rect.top)/rect.height*100))};if(pinMove.element){pinMove.element.style.left=pinMove.proposed.x+'%';pinMove.element.style.top=pinMove.proposed.y+'%'}document.getElementById('confirmPinMove').disabled=false},true);
function deleteNote(id,kind){if(!confirm('Delete this note?'))return;let key=kind==='turn'?'turns':'free';entry()[key]=entry()[key].filter(x=>x.id!==id);selected=null;save();closeModal();render()}
function uploadMap(file){if(!file)return;let reader=new FileReader();reader.onload=()=>{getTrack().map=reader.result;getTrack().mapSource='Uploaded map image';getTrack().mapStatus='found';try{save();render()}catch(e){alert('Map image is too large for browser storage. Please use a smaller image.')}};reader.readAsDataURL(file)}
const DB='pilot-onboards';function db(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('videos');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function storeVideo(id,file){let d=await db();return new Promise((res,rej)=>{let tx=d.transaction('videos','readwrite');tx.objectStore('videos').put(file,id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}async function loadVideo(id){let d=await db();return new Promise((res,rej)=>{let tx=d.transaction('videos');let r=tx.objectStore('videos').get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function removeVideoBlob(id){let d=await db();let tx=d.transaction('videos','readwrite');tx.objectStore('videos').delete(id)}async function addVideo(file){if(!file)return;let id=uid();try{await storeVideo(id,file);getTrack().videos??=[];getTrack().videos.push({id,name:file.name,size:file.size});save();renderVideos()}catch(e){alert('Video could not be saved. Browser storage may be full.')}}const onboardUrls=new Set();
function clearOnboardUrls(){for(const u of onboardUrls)URL.revokeObjectURL(u);onboardUrls.clear()}
async function renderVideos(){
 const root=$('#videoList');if(!root)return;
 clearOnboardUrls();const videos=getTrack().videos||[];
 root.innerHTML=videos.length?'':'<div class="empty">No onboard videos uploaded for this circuit yet.</div>';
 const grid=document.createElement('div');grid.className='dn-video-grid';root.append(grid);
 for(const v of videos){
  if(!root.isConnected)break;
  const box=document.createElement('div');box.className='dn-video-tile';box.dataset.videoId=v.id;
  const preview=document.createElement('button');preview.type='button';preview.className='dn-video-preview';preview.title='Open '+v.name;
  const play=document.createElement('span');play.className='dn-play';play.textContent='▶';preview.append(play);
  const title=document.createElement('div');title.className='dn-video-title';title.textContent=v.name;
  const size=document.createElement('div');size.className='muted dn-video-size';size.textContent=((v.size||0)/1048576).toFixed(1)+' MB';
  const actions=document.createElement('div');actions.className='dn-video-actions';
  const rename=document.createElement('button');rename.className='light';rename.textContent='✎ Rename';rename.onclick=()=>renameOnboardVideo(v.id);
  const del=document.createElement('button');del.className='danger';del.textContent='Delete';del.onclick=()=>removeVideo(v.id);
  actions.append(rename,del);box.append(preview,title,size,actions);grid.append(box);
  preview.onclick=()=>openOnboardVideo(v.id);
  try{const file=await loadVideo(v.id);if(!file||!box.isConnected)continue;
   const url=URL.createObjectURL(file);onboardUrls.add(url);
   const video=document.createElement('video');video.className='dn-video-thumb';video.muted=true;video.preload='metadata';video.playsInline=true;video.src=url;
   video.addEventListener('loadedmetadata',()=>{try{video.currentTime=Math.min(1,Math.max(0,(video.duration||0)/3))}catch(e){}});
   preview.prepend(video);
  }catch(e){size.textContent+=' · File unavailable';}
 }
}
function renameOnboardVideo(id){const v=(getTrack().videos||[]).find(x=>x.id===id);if(!v)return;
 const name=prompt('New video name:',v.name);if(name===null)return;const trimmed=name.trim();if(!trimmed)return alert('Please enter a name.');
 v.name=trimmed;save();renderVideos();
}
async function openOnboardVideo(id){
 const v=(getTrack().videos||[]).find(x=>x.id===id);if(!v)return;
 let file;try{file=await loadVideo(id)}catch(e){}
 if(!file)return alert('This video is unavailable on this device.');
 closeOnboardPlayer();
 const url=URL.createObjectURL(file);
 const overlay=document.createElement('div');overlay.id='dnVideoOverlay';overlay.className='dn-video-overlay';
 const bar=document.createElement('div');bar.className='dn-player-bar';
 const label=document.createElement('strong');label.textContent=v.name;
 const fullscreen=document.createElement('button');fullscreen.textContent='⛶ Full screen';fullscreen.className='light';
 const close=document.createElement('button');close.textContent='✕ Close';close.className='light';close.onclick=closeOnboardPlayer;
 bar.append(label,fullscreen,close);
 const video=document.createElement('video');video.controls=true;video.autoplay=true;video.playsInline=true;video.src=url;video.className='dn-player-video';
 fullscreen.onclick=()=>{if(video.requestFullscreen)video.requestFullscreen().catch(()=>{});else if(video.webkitEnterFullscreen)video.webkitEnterFullscreen()};
 overlay.append(bar,video);document.body.append(overlay);document.body.style.overflow='hidden';
 overlay.addEventListener('click',e=>{if(e.target===overlay)closeOnboardPlayer()});
 overlay.dataset.url=url;
 video.play().catch(()=>{});
}
function closeOnboardPlayer(){const overlay=document.getElementById('dnVideoOverlay');if(!overlay)return;
 const v=overlay.querySelector('video');if(v)v.pause();
 if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
 URL.revokeObjectURL(overlay.dataset.url);overlay.remove();document.body.style.overflow='';
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeOnboardPlayer()});
async function removeVideo(id){if(!confirm('Delete this onboard video?'))return;getTrack().videos=getTrack().videos.filter(v=>v.id!==id);save();await removeVideoBlob(id);renderVideos()}
function generalPage(){$('#view').innerHTML=`<div class="flex between"><div><h1>Car Info</h1><div class="muted">Technical references, driving reminders and setup notes — organized by car, independent of circuit.</div></div><button class="primary" onclick="addGeneralCar()">＋ Add car</button></div><div class="grid section">${state.cars.map(c=>`<div class="card"><h2>🏎️ ${esc(c.name)}</h2><p class="muted">${esc((typeof state.general[c.id]==='string'?state.general[c.id]:(state.general[c.id]?.text||'')).slice(0,110))||'No notes yet.'}</p><div class="toolbar"><button class="light" onclick="editGeneral('${c.id}')">Open / Edit →</button><button class="light" onclick="renameCar('${c.id}')">✎ Rename</button></div></div>`).join('')||'<div class="card empty">No cars yet. Add a car to start.</div>'}</div>`}function addGeneralCar(){modal('Add car',`<label>Car name</label><input id="generalCarName" placeholder="e.g. Dallara F3"><div class="toolbar"><button class="primary" onclick="let n=$('#generalCarName').value.trim();if(!n)return;let c=state.cars.find(c=>c.name.toLowerCase()===n.toLowerCase());if(!c){c={id:uid(),name:n};state.cars.push(c);save()}closeModal();editGeneral(c.id)">Add car</button></div>`)}let infoCarId=null,drawMode=false,drawActive=false,drawCtx=null,drawCanvas=null;
function editGeneral(id){infoCarId=id;navigate('carinfo')}
function carInfoPage(){let c=state.cars.find(x=>x.id===infoCarId);if(!c)return navigate('general');let v=state.general[c.id];let plain=typeof v==='string'?v:(v?.text||'');let html=typeof v==='object'&&v?.html?v.html:null;let sketch=typeof v==='object'&&v?.drawing?v.drawing:'';
$('#view').innerHTML=`<button class="back" onclick="navigate('general')">← All cars</button><div class="flex between"><div><h1>Car Info · ${esc(c.name)}</h1><div class="muted">Write and edit your car notes.</div></div><button class="light" onclick="renameCar('${c.id}')">Rename car</button></div><section class="card section"><h2>Notes</h2><div class="muted">Click inside to write and format your notes.</div><div class="editor-controls"><button class="light" onclick="formatCarText('bold')">B Bold</button><button class="light" onclick="formatCarText('insertUnorderedList')">• List</button><button class="light" onclick="formatCarText('formatBlock','h3')">Heading</button></div><div id="generalEditor" class="rich-notes" contenteditable="true" spellcheck="true" aria-label="Editable car notes"></div><div id="imageControls" class="editor-controls hide"><span class="muted" style="align-self:center">Selected drawing:</span><label style="display:flex;align-items:center;gap:7px;margin:0"><input type="checkbox" id="imageBorderToggle" style="width:auto" onchange="toggleCarImageBorder(this.checked)"> Add border</label></div><div class="toolbar"><button class="primary" onclick="saveCarInfo()">Save changes</button></div></section>`;
const editor=$('#generalEditor');if(html){editor.innerHTML=sanitizeCarHtml(html)}else{editor.textContent=plain;if(sketch){let img=document.createElement('img');img.src=sketch;img.className='inline-sketch';img.dataset.align='center';editor.append(img)}}
editor.querySelectorAll('img.inline-sketch').forEach(img=>img.draggable=true);editor.addEventListener('click',e=>{if(e.target.matches('img.inline-sketch'))selectCarImage(e.target);else selectCarImage(null)});editor.addEventListener('keyup',rememberCarCaret);editor.addEventListener('mouseup',rememberCarCaret);editor.addEventListener('focus',rememberCarCaret);editor.addEventListener('dragstart',e=>{const img=e.target.closest('img.inline-sketch');if(!img)return;draggedCarImage=img;selectCarImage(img);e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','driver-notes-inline-image')});
editor.addEventListener('dragover',e=>{if(!draggedCarImage)return;e.preventDefault();e.dataTransfer.dropEffect='move';editor.classList.add('drag-image-over')});
editor.addEventListener('dragleave',e=>{if(!editor.contains(e.relatedTarget))editor.classList.remove('drag-image-over')});
editor.addEventListener('drop',e=>{if(!draggedCarImage)return;e.preventDefault();editor.classList.remove('drag-image-over');const img=draggedCarImage;let range=document.caretRangeFromPoint?.(e.clientX,e.clientY);if(!range&&document.caretPositionFromPoint){const pos=document.caretPositionFromPoint(e.clientX,e.clientY);if(pos){range=document.createRange();range.setStart(pos.offsetNode,pos.offset);range.collapse(true)}}if(range&&editor.contains(range.startContainer)){range.collapse(true);range.insertNode(img);img.insertAdjacentText('afterend',' ')}else editor.append(img);selectCarImage(img);draggedCarImage=null;saveCarInfoQuiet()});
editor.addEventListener('dragend',()=>{draggedCarImage=null;editor.classList.remove('drag-image-over')});
selectedCarImage=null;carCaret=null;}
let selectedCarImage=null,carCaret=null,draggedCarImage=null;
function rememberCarCaret(){let sel=window.getSelection(),ed=$('#generalEditor');if(sel?.rangeCount&&ed?.contains(sel.anchorNode))carCaret=sel.getRangeAt(0).cloneRange()}
function formatCarText(cmd,value){$('#generalEditor').focus();document.execCommand(cmd,false,value||null)}
function selectCarImage(img){document.querySelectorAll('#generalEditor img.chosen').forEach(x=>x.classList.remove('chosen'));selectedCarImage=img;if(img){img.classList.add('chosen');img.draggable=true}$('#imageControls')?.classList.toggle('hide',!img);if($('#imageBorderToggle'))$('#imageBorderToggle').checked=!!img?.classList.contains('has-border')}
function toggleCarImageBorder(on){if(!selectedCarImage)return;selectedCarImage.classList.toggle('has-border',on);saveCarInfoQuiet()}
function setDrawTool(erase){drawMode=erase;$('#penButton').classList.toggle('on',!erase);$('#eraserButton').classList.toggle('on',erase)}
function drawPoint(e){let r=drawCanvas.getBoundingClientRect();return [(e.clientX-r.left)*drawCanvas.width/r.width,(e.clientY-r.top)*drawCanvas.height/r.height]}
function drawStart(e){if(!drawCtx)return;e.preventDefault();drawActive=true;drawCanvas.setPointerCapture(e.pointerId);let [x,y]=drawPoint(e);drawCtx.beginPath();drawCtx.moveTo(x,y);drawCtx.lineTo(x+.01,y+.01);drawCtx.strokeStyle=drawMode?'#ffffff':$('#drawColor').value;drawCtx.lineWidth=Number($('#drawSize').value)*(drawMode?4:1);drawCtx.stroke()}
function drawMove(e){if(!drawActive)return;e.preventDefault();let [x,y]=drawPoint(e);drawCtx.lineTo(x,y);drawCtx.stroke()}
function drawEnd(){drawActive=false}

<script>

<script id="onboard-drop-code">
(function(){
  const previousRenderVideos=renderVideos;
  renderVideos=async function(){
    // Install the drop target before video elements finish loading.
    const root=document.getElementById('videoList');
    if(root&&!document.getElementById('onboardDropZone')){
      const zone=document.createElement('div');zone.id='onboardDropZone';zone.className='onboard-dropzone';
      zone.tabIndex=0;zone.setAttribute('role','button');zone.setAttribute('aria-label','Drop an onboard video here or click to select a file');
      zone.innerHTML='<div style="font-size:27px">🎥 ⤓</div><strong>Drop your onboard video here</strong><div class="muted">Drag & drop a video file, or click to browse your device.<br>Your videos stay saved in this browser.</div>';
      root.parentNode.insertBefore(zone,root);
      const upload=async file=>{
        if(!file)return;
        if(!(file.type.startsWith('video/')||/\.(mp4|mov|m4v|webm|avi|mkv)$/i.test(file.name))){alert('Please drop a video file.');return;}
        zone.classList.add('uploading');zone.querySelector('strong').textContent='Saving onboard video…';
        try{await addVideo(file);}finally{zone.classList.remove('uploading');zone.querySelector('strong').textContent='Drop your onboard video here';}
      };
      zone.addEventListener('click',()=>document.getElementById('videoFile')?.click());
      zone.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();document.getElementById('videoFile')?.click();}});
      ['dragenter','dragover'].forEach(type=>zone.addEventListener(type,e=>{e.preventDefault();e.stopPropagation();zone.classList.add('drag-over');if(e.dataTransfer)e.dataTransfer.dropEffect='copy';}));
      ['dragleave','dragend'].forEach(type=>zone.addEventListener(type,e=>{e.preventDefault();if(!zone.contains(e.relatedTarget))zone.classList.remove('drag-over');}));
      zone.addEventListener('drop',e=>{e.preventDefault();e.stopPropagation();zone.classList.remove('drag-over');upload([...e.dataTransfer.files].find(f=>f.type.startsWith('video/')||/\.(mp4|mov|m4v|webm|avi|mkv)$/i.test(f.name))||e.dataTransfer.files[0]);});
    }
    return previousRenderVideos();
  };
  if(typeof page!=='undefined'&&page==='track')renderVideos();
})();
</script>

<script id="dn-onboard-side-and-progress">
(function(){
 'use strict';
 const uploads=new Map();
 let activeUploadId=null;
 const niceBytes=n=>n>=1048576?(n/1048576).toFixed(1)+' MB':(n/1024).toFixed(0)+' KB';
 function progressView(){
  const panel=document.querySelector('#view .dn-onboard-panel');if(!panel)return;
  let root=panel.querySelector('#dnUploadProgress');
  if(!root){root=document.createElement('div');root.id='dnUploadProgress';const list=panel.querySelector('#videoList');if(list)panel.insertBefore(root,list);else panel.append(root)}
  const entries=[...uploads.values()];
  root.innerHTML=entries.map(x=>'<div class="dn-upload-progress"><b>'+esc(x.name)+'</b><progress max="100" value="'+x.pct+'"></progress><div class="dn-progress-meta"><span>'+x.pct+'% · '+esc(x.phase)+'</span><span>'+niceBytes(x.loaded)+' / '+niceBytes(x.total)+'</span></div></div>').join('');
  root.style.display=entries.length?'block':'none';
 }
 function layout(){
  if(page!=='track')return;
  const view=document.getElementById('view');if(!view)return;
  const top=view.querySelector('.two');if(!top)return;
  const map=top.querySelector('section.card:has(#map)')||[...top.children].find(x=>x.querySelector('#map'));
  const notes=top.querySelector('section.card:has(#notesList)')||[...top.children].find(x=>x.querySelector('#notesList'));
  const onboard=view.querySelector('section.card:has(#videoList)');
  if(!map||!notes||!onboard)return;
  top.classList.add('dn-track-top');
  onboard.classList.add('dn-onboard-panel');
  notes.classList.add('dn-track-notes');
  // Explicitly move BOTH map and onboard into the same grid; put notes after it.
  if(map.parentElement!==top)top.append(map);
  if(onboard.parentElement!==top)top.append(onboard);
  if(notes.parentElement===top||notes.previousElementSibling!==top)top.insertAdjacentElement('afterend',notes);
  progressView();
 }
 const oldTrackPage=trackPage;
 trackPage=function(){oldTrackPage();layout();};
 const oldRenderVideos=renderVideos;
 renderVideos=async function(){
  layout();
  const result=await oldRenderVideos.apply(this,arguments);
  progressView();return result;
 };
 // IndexedDB does not report granular write progress. Read the file in small
 // asynchronous chunks to provide real preparation progress, then report the
 // final database commit as a separate indeterminate step.
 const oldStoreVideo=storeVideo;
 storeVideo=async function(id,file){
  const total=file.size||0;
  const progress={name:file.name||'Onboard video',pct:0,loaded:0,total,phase:'Preparing video'};
  uploads.set(id,progress);activeUploadId=id;progressView();
  try{
   const chunks=[],chunkSize=2*1024*1024;
   for(let start=0;start<total;start+=chunkSize){
    chunks.push(await file.slice(start,Math.min(total,start+chunkSize)).arrayBuffer());
    progress.loaded=Math.min(total,start+chunkSize);
    progress.pct=Math.min(95,Math.round(progress.loaded/total*95));
    progressView();
    // Let other controls, track notes and navigation remain responsive.
    await new Promise(resolve=>setTimeout(resolve,0));
   }
   progress.phase='Saving to browser storage';progress.pct=95;progressView();
   const assembled=new File(chunks,file.name,{type:file.type||'video/mp4',lastModified:file.lastModified||Date.now()});
   await oldStoreVideo(id,assembled);
   progress.phase='Saved';progress.pct=100;progress.loaded=total;progressView();
  }catch(e){progress.phase='Could not save video';progressView();throw e;}
  finally{uploads.delete(id);if(activeUploadId===id)activeUploadId=null;progressView();}
 };
 // Preserve any telemetry dataset creation logic already wrapping addVideo.
 // Video playback appears automatically when the database commit finishes.
 // Keep layout correct after every page change and asynchronous onboard render.
 const originalRender=render;
 render=function(){const result=originalRender.apply(this,arguments);if(page==='track')queueMicrotask(layout);return result;};
 if(page==='track')queueMicrotask(layout);
})();

<script id="dn-final-layout-behavior">
(function(){
 'use strict';
 // Sorting only for display: all existing circuit IDs, notes and links stay intact.
 const previousHome=home;
 home=function(){
   state.tracks.sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),undefined,{sensitivity:'base',numeric:true}));
   previousHome();
   updatePhotoVisibility();
 };
 function fixTrackLayout(){
   if(page!=='track')return;
   const view=document.getElementById('view');if(!view)return;
   const map=view.querySelector('#map');
   const videos=view.querySelector('#videoList');
   const notes=view.querySelector('#notesList');
   if(!map||!videos||!notes)return;
   const mapSection=map.closest('section.card');
   const videoSection=videos.closest('section.card');
   const notesSection=notes.closest('section.card');
   if(!mapSection||!videoSection||!notesSection)return;
   let row=view.querySelector('.dn-fixed-track-row');
   if(!row){row=document.createElement('div');row.className='dn-fixed-track-row';
     const previous=mapSection.parentElement;
     previous.parentElement.insertBefore(row,previous);
   }
   mapSection.classList.add('dn-map-panel');
   videoSection.classList.add('dn-onboard-panel');
   notesSection.classList.add('dn-fixed-track-notes');
   row.appendChild(mapSection);
   row.appendChild(videoSection);
   row.insertAdjacentElement('afterend',notesSection);
   // Remove now-empty original grid to avoid a phantom row.
   for(const node of [...view.querySelectorAll('.two')])if(!node.children.length)node.remove();
 }
 const previousTrackPage=trackPage;
 trackPage=function(){previousTrackPage();fixTrackLayout();};
 // Called after the video list has been updated, too.

 function updatePhotoVisibility(){
   const gallery=document.querySelector('.side .dn-sidebar-gallery');

 render=function(){previousRender();if(page==='track')fixTrackLayout();updatePhotoVisibility();};

#view .dn-library-toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:16px}
#view .dn-library-item{border:1px solid #30455f;border-radius:7px;padding:14px;margin-bottom:10px;background:#0c192a;cursor:pointer;transition:border-color .15s ease}
#view .dn-library-item:hover,#view .dn-library-item:focus-visible{border-color:#ef405c}
#view .dn-library-item h3{font-family:inherit!important;font-size:15px!important;margin:0 0 6px;letter-spacing:0;text-transform:none!important}
#view .dn-library-item .muted{white-space:pre-wrap;overflow-wrap:anywhere}
#view .dn-library-list{max-height:70vh;overflow:auto;padding-right:3px}
body.dn-day #view .dn-library-item{background:#f8fafd;border-color:#cbd8e8}
body.dn-day #view .dn-library-item:hover,body.dn-day #view .dn-library-item:focus-visible{border-color:#dc2947}
#view .dn-library-empty{padding:18px 10px;text-align:center;color:#91a5bc;font-size:13px}
@media(max-width:800px){#view .dn-library-grid{grid-template-columns:1fr}}
</style>
<script id="dn-personal-notes-library">
(function(){
  'use strict';
  // Notes live in the existing state and therefore participate in its JSON backup.
  if(!Array.isArray(state.personalNotes))state.personalNotes=[];
  let editingNoteId=null;
  function noteDate(n){const d=new Date(n.updatedAt||n.createdAt||Date.now());return isNaN(d.getTime())?'Saved':d.toLocaleDateString();}
  function notesPage(){
    const notes=state.personalNotes||[];
    const current=notes.find(n=>n.id===editingNoteId);
    document.getElementById('view').innerHTML=`
      <div class="flex between"><div><h1>Notes</h1><p class="muted">Your personal racing notebook · Saved locally on this device</p></div><button class="light" onclick="driverNewPersonalNote()">＋ New note</button></div>
      <div class="dn-library-grid">
        <section class="card"><h2>${current?'Edit note':'Write a note'}</h2>
          <label for="dnPersonalTitle">Title</label><input id="dnPersonalTitle" placeholder="e.g. Race weekend reminders" maxlength="160" value="${esc(current?.title||'')}">
          <label for="dnPersonalBody">Notes</label><textarea id="dnPersonalBody" class="dn-library-editor" placeholder="Write your notes here...">${esc(current?.text||'')}</textarea>
          <div class="dn-library-toolbar"><button class="primary" onclick="driverSavePersonalNote()">✓ ${current?'Save changes':'Save note'}</button><button class="light" onclick="driverNewPersonalNote()">Clear / New</button>${current?'<button class="danger" onclick="driverDeletePersonalNote()">Delete note</button>':''}</div>
          <p class="muted" id="dnPersonalStatus">Notes stay saved in this browser and are included in the JSON backup from Settings.</p>
        </section>
        <section class="card"><h2>Saved Notes <span class="muted">(${notes.length})</span></h2><div class="dn-library-list">
        ${notes.length?[...notes].sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)).map(n=>`<div class="dn-library-item" role="button" tabindex="0" onclick="driverOpenPersonalNote('${n.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();driverOpenPersonalNote('${n.id}')}" aria-label="Open ${esc(n.title||'Untitled note')}"><h3>${esc(n.title||'Untitled note')}</h3><div class="muted">${esc((n.text||'').slice(0,125))}${(n.text||'').length>125?'…':''}</div><div class="muted" style="margin-top:9px;font-size:11px">${esc(noteDate(n))}</div></div>`).join(''):'<div class="dn-library-empty">No saved notes yet.<p>Create your first note using the editor.</p></div>'}
        </div></section>
      </div>`;
  }
  window.driverOpenPersonalNote=function(id){editingNoteId=id;notesPage();document.getElementById('dnPersonalTitle')?.focus();};
  window.driverNewPersonalNote=function(){editingNoteId=null;notesPage();document.getElementById('dnPersonalTitle')?.focus();};
  window.driverSavePersonalNote=function(){
    const title=document.getElementById('dnPersonalTitle')?.value.trim();
    const text=document.getElementById('dnPersonalBody')?.value.trim();
    if(!title){alert('Please enter a title for the note.');document.getElementById('dnPersonalTitle')?.focus();return;}
    if(!text){alert('Please write some notes before saving.');document.getElementById('dnPersonalBody')?.focus();return;}
    const old=state.personalNotes.find(n=>n.id===editingNoteId);
    const now=Date.now();
    const item=old?{...old,title,text,updatedAt:now}:{id:uid(),title,text,createdAt:now,updatedAt:now};
    if(old)state.personalNotes.splice(state.personalNotes.indexOf(old),1,item);
    else state.personalNotes.push(item);
    try{save();}catch(e){if(old)state.personalNotes.splice(state.personalNotes.indexOf(item),1,old);else state.personalNotes.pop();alert('Unable to save. Browser storage might be full.');return;}
    editingNoteId=item.id;notesPage();
    const status=document.getElementById('dnPersonalStatus');if(status)status.textContent='✓ Note saved successfully.';
  };
  window.driverDeletePersonalNote=function(){
    const current=state.personalNotes.find(n=>n.id===editingNoteId);
    if(!current||!confirm('Delete this saved note?'))return;
    state.personalNotes=state.personalNotes.filter(n=>n.id!==editingNoteId);
    try{save();}catch(e){state.personalNotes.push(current);alert('Unable to delete this note.');return;}
    editingNoteId=null;notesPage();
  };
  const notesButton=document.querySelector('.side .nav[data-page="notes"]');
  if(notesButton)notesButton.onclick=()=>navigate('notes');
  const previousRender=render;
  render=function(){if(page==='notes')return notesPage();return previousRender.apply(this,arguments);};
})();
</script>
</body></html>
